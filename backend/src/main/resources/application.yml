spring:
  application:
    name: cloudops-manager
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2000ms}
      ssl:
        enabled: ${REDIS_SSL:false}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

cloudops:
  app:
    name: cloudops-manager
    version: "1.0.0"
    release: ${CLOUDOPS_APP_RELEASE:release-2026.08-p53.1}
  aws:
    region: ${AWS_REGION:us-east-1}
    role-arn: ${AWS_ROLE_ARN:}
  dashboard:
    cache:
      type: ${DASHBOARD_CACHE_TYPE:memory}
    snapshot:
      fresh-ttl-seconds: ${DASHBOARD_FRESH_TTL:60}
      stale-ttl-seconds: ${DASHBOARD_STALE_TTL:600}
      refresh-lock-ttl-seconds: ${DASHBOARD_LOCK_TTL:120}
  logging:
    level: ${LOG_LEVEL:INFO}

management:
  endpoints:
    web:
      exposure:
        include: health,info
