spring:
  application:
    name: cloudops-manager
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

cloudops:
  app:
    name: cloudops-manager
    version: "1.0.0"
    release: "release-2026.08-p38"
  aws:
    region: ${AWS_REGION:us-east-1}
    role-arn: ${AWS_ROLE_ARN:}
  logging:
    level: ${LOG_LEVEL:INFO}

management:
  endpoints:
    web:
      exposure:
        include: health,info
