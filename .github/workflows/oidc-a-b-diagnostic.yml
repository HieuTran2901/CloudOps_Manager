name: OIDC A/B STS Isolation Diagnostic

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  oidc-a-b-test:
    name: OIDC A/B Diagnostic Test
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Obtain GitHub OIDC Token & Decode Claims
        id: oidc-token
        run: |
          set -e
          echo "=== 1. Requesting OIDC token with audience sts.amazonaws.com ==="
          TOKEN_RESPONSE=$(curl --fail --silent --show-error \
            --connect-timeout 5 \
            --max-time 15 \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          
          TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.value')
          
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "ERROR: Failed to obtain OIDC token from GitHub token service"
            exit 1
          fi
          
          echo "OIDC token obtained successfully."
          
          echo "=== 2. Decoding non-sensitive payload claims ==="
          CLAIMS_OUT=$(OIDC_TOKEN="$TOKEN" node - <<'NODE'
          const token = process.env.OIDC_TOKEN;

          if (!token) {
            console.error("OIDC token missing");
            process.exit(1);
          }

          const parts = token.split(".");
          if (parts.length !== 3) {
            console.error("Invalid JWT structure");
            process.exit(1);
          }

          const payload = Buffer.from(parts[1], "base64url").toString("utf8");
          const claims = JSON.parse(payload);

          for (const key of [
            "iss",
            "aud",
            "sub",
            "repository",
            "repository_owner",
            "repository_id",
            "repository_owner_id",
            "ref",
            "ref_type"
          ]) {
            console.log(`${key}=${claims[key] ?? ""}`);
          }
          NODE
          )
          
          echo "$CLAIMS_OUT"
          
          ACTUAL_SUB=$(echo "$CLAIMS_OUT" | grep "^sub=" | cut -d'=' -f2-)
          ACTUAL_REF=$(echo "$CLAIMS_OUT" | grep "^ref=" | cut -d'=' -f2-)
          ACTUAL_REF_TYPE=$(echo "$CLAIMS_OUT" | grep "^ref_type=" | cut -d'=' -f2-)
          
          EXPECTED_SUB="repo:HieuTran2901/CloudOps_Manager:ref:refs/tags/release-2026.08-p45-oidc1"
          EXPECTED_REF="refs/tags/release-2026.08-p45-oidc1"
          EXPECTED_REF_TYPE="tag"
          
          echo "=== 3. Subject Claim & Ref Context Pre-Verification ==="
          echo "Target Diagnostic Sub: $EXPECTED_SUB"
          echo "Actual Token Sub:      $ACTUAL_SUB"
          echo "Target Ref:            $EXPECTED_REF ($EXPECTED_REF_TYPE)"
          echo "Actual Ref:            $ACTUAL_REF ($ACTUAL_REF_TYPE)"
          
          if [ "$ACTUAL_SUB" != "$EXPECTED_SUB" ] || [ "$ACTUAL_REF" != "$EXPECTED_REF" ] || [ "$ACTUAL_REF_TYPE" != "$EXPECTED_REF_TYPE" ]; then
            echo "ERROR: EXPECTED_SUB_MISMATCH"
            echo "When running via workflow_dispatch in the GitHub Actions UI, select 'Use workflow from: Tags -> release-2026.08-p45-oidc1'."
            exit 1
          fi
          
          echo "MATCH: OIDC token subject and ref context exactly match the diagnostic target."
          
          echo -n "$TOKEN" > /tmp/oidc_token
          chmod 600 /tmp/oidc_token

      - name: 3. Test Production Role (CloudOpsDeployerRole)
        run: |
          set +e
          echo "=== A. Testing CloudOpsDeployerRole ==="
          TOKEN=$(cat /tmp/oidc_token)
          
          PROD_OUT=$(aws sts assume-role-with-web-identity \
            --role-arn "arn:aws:iam::351405419700:role/CloudOpsDeployerRole" \
            --role-session-name "diagnostic-prod-role" \
            --web-identity-token "$TOKEN" \
            --region "ap-southeast-2" \
            --output json 2>&1)
          
          PROD_EXIT=$?
          if [ $PROD_EXIT -eq 0 ]; then
            echo "STS_ASSUME_ROLE_SUCCESS"
            echo "Assumed ARN: $(echo "$PROD_OUT" | jq -r '.AssumedRoleUser.Arn // "N/A"')"
            echo "Assumed Role ID: $(echo "$PROD_OUT" | jq -r '.AssumedRoleUser.AssumedRoleId // "N/A"')"
          else
            echo "CloudOpsDeployerRole Result: FAILED (Exit Code $PROD_EXIT)"
            echo "$PROD_OUT" | grep -E "(An error occurred|AccessDenied|InvalidIdentityToken|OpenIDConnect|error)" || echo "$PROD_OUT"
          fi

      - name: 4. Test Diagnostic Role (CloudOpsOIDCDiagnosticRole)
        run: |
          set +e
          echo "=== B. Testing CloudOpsOIDCDiagnosticRole ==="
          TOKEN=$(cat /tmp/oidc_token)
          rm -f /tmp/oidc_token
          
          DIAG_OUT=$(aws sts assume-role-with-web-identity \
            --role-arn "arn:aws:iam::351405419700:role/CloudOpsOIDCDiagnosticRole" \
            --role-session-name "diagnostic-test-role" \
            --web-identity-token "$TOKEN" \
            --region "ap-southeast-2" \
            --output json 2>&1)
          
          DIAG_EXIT=$?
          if [ $DIAG_EXIT -eq 0 ]; then
            echo "STS_ASSUME_ROLE_SUCCESS"
            echo "Assumed ARN: $(echo "$DIAG_OUT" | jq -r '.AssumedRoleUser.Arn // "N/A"')"
            echo "Assumed Role ID: $(echo "$DIAG_OUT" | jq -r '.AssumedRoleUser.AssumedRoleId // "N/A"')"
          else
            echo "CloudOpsOIDCDiagnosticRole Result: FAILED (Exit Code $DIAG_EXIT)"
            echo "$DIAG_OUT" | grep -E "(An error occurred|AccessDenied|InvalidIdentityToken|OpenIDConnect|error)" || echo "$DIAG_OUT"
          fi
