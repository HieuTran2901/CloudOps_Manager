name: CloudOps Manager Production Deployment Pipeline

on:
  push:
    tags:
      - 'release-*'
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-2
  AWS_ACCOUNT_ID: '351405419700'
  ECR_BACKEND_REPO: cloudops/backend
  ECR_FRONTEND_REPO: cloudops/frontend
  ECS_CLUSTER: cloudops-prod
  ECS_BACKEND_SERVICE: cloudops-backend-service
  ECS_FRONTEND_SERVICE: cloudops-frontend-service

jobs:
  # Stage 1-5: Build, Test & Static Security Verification
  verify-and-build:
    name: Build & Verify Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: 3. Backend Compilation & Test Suite
        run: |
          cd backend
          chmod +x mvnw
          ./mvnw clean test

      - name: 4. Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 5. Frontend Dependencies & Production Build
        run: |
          cd frontend
          npm ci
          npm run build

      - name: 6. Static Security & Secret Audit
        run: |
          # Verify 0 hardcoded AWS credentials or forbidden patterns
          ! grep -rE "AKIA[0-9A-Z]{16}" frontend/src/
          ! grep -rE "@aws-sdk" frontend/src/

  # Stage 6-9: Remote Container Image Build & ECR Publication
  container-publish:
    name: Build & Publish Container Images
    needs: verify-and-build
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.set-image-tag.outputs.image_tag }}
      backend-digest: ${{ steps.publish-backend.outputs.backend_digest }}
      backend-image: ${{ steps.publish-backend.outputs.backend_image }}
      frontend-digest: ${{ steps.publish-frontend.outputs.frontend_digest }}
      frontend-image: ${{ steps.publish-frontend.outputs.frontend_image }}
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Configure AWS Credentials via Dedicated Deployment Role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::351405419700:role/CloudOpsDeployerRole
          aws-region: ap-southeast-2

      - name: 3. Authenticate Docker to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 4. Set Image Tag Output
        id: set-image-tag
        run: |
          echo "image_tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: 5. Idempotent Build & Publish Backend Image
        id: publish-backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE_URI="$ECR_REGISTRY/$ECR_BACKEND_REPO"
          echo "Checking if $ECR_BACKEND_REPO:$IMAGE_TAG already exists in ECR..."

          set +e
          DESCRIBE_OUT=$(aws ecr describe-images \
            --repository-name "$ECR_BACKEND_REPO" \
            --image-ids imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION" \
            --query "imageDetails[0].imageDigest" \
            --output text 2>&1)
          DESCRIBE_EXIT=$?
          set -e

          if [ $DESCRIBE_EXIT -eq 0 ] && [[ "$DESCRIBE_OUT" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            BACKEND_DIGEST="$DESCRIBE_OUT"
            echo "MATCH: Image $ECR_BACKEND_REPO:$IMAGE_TAG already exists in ECR with immutable digest $BACKEND_DIGEST."
            echo "Reusing existing immutable image (skipping docker build & docker push)."
          elif echo "$DESCRIBE_OUT" | grep -q "ImageNotFoundException"; then
            echo "Image $ECR_BACKEND_REPO:$IMAGE_TAG does not exist in ECR. Building and publishing..."
            docker build -t "$IMAGE_URI:$IMAGE_TAG" backend/
            docker push "$IMAGE_URI:$IMAGE_TAG"

            BACKEND_DIGEST=$(aws ecr describe-images \
              --repository-name "$ECR_BACKEND_REPO" \
              --image-ids imageTag="$IMAGE_TAG" \
              --region "$AWS_REGION" \
              --query "imageDetails[0].imageDigest" \
              --output text)
            if [[ ! "$BACKEND_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "ERROR: Failed to resolve valid digest for newly published image $ECR_BACKEND_REPO:$IMAGE_TAG."
              exit 1
            fi
            echo "Successfully published $ECR_BACKEND_REPO:$IMAGE_TAG with digest $BACKEND_DIGEST."
          else
            echo "ERROR: Unexpected AWS ECR error querying $ECR_BACKEND_REPO:$IMAGE_TAG:"
            echo "$DESCRIBE_OUT"
            exit 1
          fi

          echo "BACKEND_DIGEST=$BACKEND_DIGEST" >> $GITHUB_ENV
          echo "backend_digest=$BACKEND_DIGEST" >> $GITHUB_OUTPUT
          echo "backend_image=$IMAGE_URI@$BACKEND_DIGEST" >> $GITHUB_OUTPUT

      - name: 6. Idempotent Build & Publish Frontend Image
        id: publish-frontend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE_URI="$ECR_REGISTRY/$ECR_FRONTEND_REPO"
          echo "Checking if $ECR_FRONTEND_REPO:$IMAGE_TAG already exists in ECR..."

          set +e
          DESCRIBE_OUT=$(aws ecr describe-images \
            --repository-name "$ECR_FRONTEND_REPO" \
            --image-ids imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION" \
            --query "imageDetails[0].imageDigest" \
            --output text 2>&1)
          DESCRIBE_EXIT=$?
          set -e

          if [ $DESCRIBE_EXIT -eq 0 ] && [[ "$DESCRIBE_OUT" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            FRONTEND_DIGEST="$DESCRIBE_OUT"
            echo "MATCH: Image $ECR_FRONTEND_REPO:$IMAGE_TAG already exists in ECR with immutable digest $FRONTEND_DIGEST."
            echo "Reusing existing immutable image (skipping docker build & docker push)."
          elif echo "$DESCRIBE_OUT" | grep -q "ImageNotFoundException"; then
            echo "Image $ECR_FRONTEND_REPO:$IMAGE_TAG does not exist in ECR. Building and publishing..."
            docker build -t "$IMAGE_URI:$IMAGE_TAG" frontend/
            docker push "$IMAGE_URI:$IMAGE_TAG"

            FRONTEND_DIGEST=$(aws ecr describe-images \
              --repository-name "$ECR_FRONTEND_REPO" \
              --image-ids imageTag="$IMAGE_TAG" \
              --region "$AWS_REGION" \
              --query "imageDetails[0].imageDigest" \
              --output text)
            if [[ ! "$FRONTEND_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "ERROR: Failed to resolve valid digest for newly published image $ECR_FRONTEND_REPO:$IMAGE_TAG."
              exit 1
            fi
            echo "Successfully published $ECR_FRONTEND_REPO:$IMAGE_TAG with digest $FRONTEND_DIGEST."
          else
            echo "ERROR: Unexpected AWS ECR error querying $ECR_FRONTEND_REPO:$IMAGE_TAG:"
            echo "$DESCRIBE_OUT"
            exit 1
          fi

          echo "FRONTEND_DIGEST=$FRONTEND_DIGEST" >> $GITHUB_ENV
          echo "frontend_digest=$FRONTEND_DIGEST" >> $GITHUB_OUTPUT
          echo "frontend_image=$IMAGE_URI@$FRONTEND_DIGEST" >> $GITHUB_OUTPUT

  # Stage 10-14: ECS Deployment, Health Verification & Release Gate
  ecs-deployment:
    name: ECS Fargate Rollout & Acceptance
    needs: container-publish
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Configure AWS Credentials for Deployment
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::351405419700:role/CloudOpsDeployerRole
          aws-region: ap-southeast-2

      - name: 3. Authenticate Docker to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 4. Render ECS Task Definition for Backend
        id: render-backend-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: infrastructure/ecs/cloudops-backend-task.json
          container-name: cloudops-backend
          image: ${{ needs.container-publish.outputs.backend-image }}

      - name: 5. Deploy ECS Task Definition to Backend Service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-backend-task-def.outputs.task-definition }}
          service: ${{ env.ECS_BACKEND_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: 6. Execute Production Smoke Test & Live Acceptance
        run: |
          chmod +x scripts/production-smoke-test.sh
          ./scripts/production-smoke-test.sh