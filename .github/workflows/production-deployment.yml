name: CloudOps Manager Production Deployment Pipeline

on:
  push:
    tags:
      - 'release-*'
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-2
  AWS_ACCOUNT_ID: '351405419700'
  ECR_BACKEND_REPO: cloudops-manager-backend
  ECR_FRONTEND_REPO: cloudops-manager-frontend
  ECS_CLUSTER: cloudops-production
  ECS_BACKEND_SERVICE: cloudops-backend-service
  ECS_FRONTEND_SERVICE: cloudops-frontend-service
  RELEASE_VERSION: '1.0.0'
  RELEASE_TAG: 'release-2026.08-p38'

jobs:
  # Stage 1-5: Build, Test & Static Security Verification
  verify-and-build:
    name: Build & Verify Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: 3. Backend Compilation & Test Suite
        run: |
          cd backend
          ./mvnw clean test

      - name: 4. Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 5. Frontend Dependencies & Production Build
        run: |
          cd frontend
          npm ci
          npm run build

      - name: 6. Static Security & Secret Audit
        run: |
          # Verify 0 hardcoded AWS credentials or forbidden patterns
          ! grep -rE "AKIA[0-9A-Z]{16}" frontend/src/
          ! grep -rE "@aws-sdk" frontend/src/

  # Stage 6-9: Remote Container Image Build & ECR Publication
  container-publish:
    name: Build & Publish Container Images
    needs: verify-and-build
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Configure AWS Credentials via Dedicated Deployment Role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::351405419700:role/CloudOpsDeployerRole
          aws-region: ap-southeast-2

      - name: 3. Authenticate Docker to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 4. Build, Tag & Push Backend Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_BACKEND_REPO"
          docker build -t "$IMAGE_URI:$RELEASE_VERSION" -t "$IMAGE_URI:$RELEASE_TAG" backend/
          docker push "$IMAGE_URI:$RELEASE_VERSION"
          docker push "$IMAGE_URI:$RELEASE_TAG"
          BACKEND_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE_URI:$RELEASE_VERSION")
          echo "BACKEND_DIGEST=$BACKEND_DIGEST" >> $GITHUB_ENV

      - name: 5. Build, Tag & Push Frontend Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_FRONTEND_REPO"
          docker build -t "$IMAGE_URI:$RELEASE_VERSION" -t "$IMAGE_URI:$RELEASE_TAG" frontend/
          docker push "$IMAGE_URI:$RELEASE_VERSION"
          docker push "$IMAGE_URI:$RELEASE_TAG"
          FRONTEND_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE_URI:$RELEASE_VERSION")
          echo "FRONTEND_DIGEST=$FRONTEND_DIGEST" >> $GITHUB_ENV

  # Stage 10-14: ECS Deployment, Health Verification & Release Gate
  ecs-deployment:
    name: ECS Fargate Rollout & Acceptance
    needs: container-publish
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Configure AWS Credentials for Deployment
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::351405419700:role/CloudOpsDeployerRole
          aws-region: ap-southeast-2

      - name: 3. Trigger ECS Service Deployment
        run: |
          aws ecs update-service --cluster $ECS_CLUSTER --service $ECS_BACKEND_SERVICE --force-new-deployment --region $AWS_REGION
          aws ecs update-service --cluster $ECS_CLUSTER --service $ECS_FRONTEND_SERVICE --force-new-deployment --region $AWS_REGION

      - name: 4. Wait for ECS Services Stable Rollout
        run: |
          aws ecs wait services-stable --cluster $ECS_CLUSTER --services $ECS_BACKEND_SERVICE $ECS_FRONTEND_SERVICE --region $AWS_REGION

      - name: 5. Execute Production Smoke Test & Live Acceptance
        run: |
          chmod +x scripts/production-smoke-test.sh
          ./scripts/production-smoke-test.sh